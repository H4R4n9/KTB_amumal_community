## docker-compose.blue.yaml 
## blue-green deploy 중 blue
services:
 blue:
    image: ${BACKEND_IMAGE:-registry/amumal-backend:1.0.1}
    container_name: amumal-be-blue
    restart: unless-stopped
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-amumal}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true"
      DB_USERNAME: ${MYSQL_USER:-amumal}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local-password}
      JWT_SECRET: ${JWT_SECRET:-compose-local-development-secret-key-change-me-1234567890}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-1800}
      JWT_REFRESH_TOKEN_EXPIRATION_SECONDS: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:-1209600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      SERVER_SERVLET_CONTEXT_PATH: /v1
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FILE_UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080" ## blue인 경우 8080번
    volumes:
      - backend-uploads:/app/uploads
    command:
      - --spring.profiles.active=prod,blue

volumes:
  backend-uploads:
    name: amumal-backend-uploads

networks:
  default:
    name: amumal-dev
    external: true
