spring.application.name=amumal
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/amumal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

## hibernate statistics
spring.jpa.properties.hibernate.generate_statistics=true
app.hibernate-query-count.enabled=${HIBERNATE_QUERY_COUNT_ENABLED:false}

## slow query 측정
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=10

# SQL 횟수
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.state=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
## logging.level.org.hibernate.session.metrics=DEBUG

security.jwt.secret=${JWT_SECRET:amumal-local-development-secret-key-1234567890}
security.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
security.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://kylamumal.cloud}

# health만 외부에 노출
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 종료 중 진행 중인 요청 처리
spring.lifecycle.timeout-per-shutdown-phase=20s
