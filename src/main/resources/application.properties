spring.application.name=amumal
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/amumal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

## Slow query measurement (0 disables it)
spring.jpa.properties.hibernate.log_slow_query=${HIBERNATE_SLOW_QUERY_MS:0}

security.jwt.secret=${JWT_SECRET:amumal-local-development-secret-key-1234567890}
security.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
security.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://kylamumal.cloud}

# S3 image storage
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:amumal-local}
aws.s3.region=${AWS_REGION:ap-northeast-2}
app.image.presigned-url-expiration=${IMAGE_PRESIGNED_URL_EXPIRATION:10m}
app.image.max-file-size=${IMAGE_MAX_FILE_SIZE:10MB}
app.image.lambda-callback-secret=${IMAGE_LAMBDA_CALLBACK_SECRET:local-image-callback-secret-change-me}
app.image.orphan-retention=${IMAGE_ORPHAN_RETENTION:24h}
app.image.orphan-cleanup-cron=${IMAGE_ORPHAN_CLEANUP_CRON:0 0 * * * *}

# health만 외부에 노출
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 종료 중 진행 중인 요청 처리
spring.lifecycle.timeout-per-shutdown-phase=20s
