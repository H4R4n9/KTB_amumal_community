# Hibernate 계측 오버헤드 제거
spring.jpa.properties.hibernate.log_slow_query=0

# SQL 및 바인딩 로그 비활성화
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# 기존 설정 유지
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# 커넥션 풀 조건을 전후 동일하게 고정
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=amumal-perf-pool


management.endpoints.web.exposure.include=health,metrics

management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# log 수집
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.pattern=%t "%r" status=%s bytes=%b elapsed_ms=%{ms}T