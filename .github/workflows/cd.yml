name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: ECR image tag to deploy. Defaults to the current commit SHA.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'amumal-be' }}
  SSM_INSTANCE_ID: ${{ secrets.SSM_INSTANCE_ID }}
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ubuntu/deploy' }}
  ROLLBACK_SCRIPT: ${{ vars.ROLLBACK_SCRIPT || '' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image to deploy
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -Eeuo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"
          echo "ecr_registry=${ECR_REGISTRY}" >> "${GITHUB_OUTPUT}"

      - name: Deploy through SSM
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          ECR_REGISTRY: ${{ steps.image.outputs.ecr_registry }}
        run: |
          set -Eeuo pipefail

          if [ -z "${SSM_INSTANCE_ID}" ]; then
            echo "SSM_INSTANCE_ID secret is required."
            exit 1
          fi

          ROLLBACK_SCRIPT_PATH="${ROLLBACK_SCRIPT:-${DEPLOY_DIR}/rollback.sh}"

          cat > ssm-parameters.json <<EOF
          {
            "commands": [
              "set -Eeuo pipefail",
              "cd \"${DEPLOY_DIR}\"",
              "test -x ./deploy-blue-green.sh",
              "test -x \"${ROLLBACK_SCRIPT_PATH}\"",
              "aws ecr get-login-password --region \"${AWS_REGION}\" | sudo docker login --username AWS --password-stdin \"${ECR_REGISTRY}\"",
              "sudo docker pull \"${IMAGE_URI}\"",
              "if ! BACKEND_IMAGE=\"${IMAGE_URI}\" ROLLBACK_SCRIPT=\"${ROLLBACK_SCRIPT_PATH}\" ./deploy-blue-green.sh; then echo \"deploy failed; running rollback.sh\"; \"${ROLLBACK_SCRIPT_PATH}\"; exit 1; fi"
            ]
          }
          EOF

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${SSM_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy amumal backend ${IMAGE_TAG}" \
              --parameters file://ssm-parameters.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command id: ${COMMAND_ID}"

          set +e
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${SSM_INSTANCE_ID}"
          WAIT_STATUS=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${SSM_INSTANCE_ID}" \
            --query "{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          exit "${WAIT_STATUS}"
