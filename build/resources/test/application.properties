spring.datasource.url=jdbc:h2:mem:community-test;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

security.jwt.secret=community-test-secret-key-1234567890
security.jwt.access-token-expiration-seconds=1800
security.jwt.refresh-token-expiration-seconds=1209600

post-stats.refresh-delay-ms=3600000
